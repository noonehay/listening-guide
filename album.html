<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Album of the week</title>
<meta name="description" content="One album a week from 1001 Albums You Must Hear Before You Die.">
<meta property="og:title" content="Album of the week · Hayden's listening guide">
<meta name="theme-color" content="#0f261f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap">
<style>
:root { --bg: #0f261f; --card: #163329; --line: rgba(244, 239, 225, .14); --fg: #f4efe1; --muted: #a8b8ae; --orange: #ff5200; --mustard: #d1bd19;
  --hl-o: linear-gradient(transparent 50%, rgba(255, 82, 0, .6) 50%, rgba(255, 82, 0, .6) 90%, transparent 90%);
  --hl-m: linear-gradient(transparent 50%, rgba(209, 189, 25, .35) 50%, rgba(209, 189, 25, .35) 90%, transparent 90%);
  --font: 'Quicksand', 'Segoe UI', system-ui, sans-serif; color-scheme: dark; }
html, body { margin: 0; background: #0b1d17; color: var(--fg); }
body { font-family: var(--font); font-size: 15.5px; line-height: 1.55; padding: 16px max(16px, env(safe-area-inset-left, 0px)) 40px max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 900px; margin: 0 auto; background: var(--bg); border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 28px; box-sizing: border-box; }
@media (max-width: 600px) { body { padding: 0; } .wrap { border-radius: 0; padding: 22px 16px; } }
a.hl { color: var(--fg); text-decoration: none; background: var(--hl-m); padding: 0 3px; font-weight: 600; }
a.hl:hover { background: rgba(209, 189, 25, .35); }
.eyebrow { font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.hero { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: clamp(20px, 4vw, 36px); display: grid; grid-template-columns: minmax(0, 280px) minmax(0, 1fr); gap: 28px; align-items: start; }
.hero .info { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.cover { width: 100%; aspect-ratio: 1; border-radius: 10px; object-fit: cover; background: #1c3d32; box-shadow: 0 14px 34px rgba(0, 0, 0, .45); display: block; max-width: 100%; }
@media (max-width: 700px) { .hero { grid-template-columns: minmax(0, 1fr); } .cover { max-width: 320px; } }

.hero.noart { grid-template-columns: minmax(0, 1fr); }
td.art { padding: 6px 10px; width: 44px; } td.art img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; display: block; background: #1c3d32; }
.hero h1 { margin: 0; font-size: clamp(34px, 7vw, 60px); line-height: 1.15; font-weight: 700; text-wrap: balance; }
.hero h1 span { background: var(--hl-o); padding: 0 6px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.artist { margin: 0; font-size: clamp(20px, 3.4vw, 26px); font-weight: 700; color: var(--mustard); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 14px; }
.meta b { color: var(--fg); font-weight: 600; }
.blurb { margin: 0; max-width: 62ch; font-size: 16.5px; }
.listen { align-self: flex-start; display: inline-flex; gap: 10px; align-items: center; text-decoration: none; color: var(--bg); background: var(--orange); border-radius: 10px; padding: 12px 20px; font-weight: 700; }
.listen:hover { background: var(--mustard); }
h2 { margin: 0 0 12px; font-size: 18px; font-weight: 700; color: var(--mustard); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; }
td.num { font-variant-numeric: tabular-nums; color: var(--muted); }
tr.now td { color: var(--fg); font-weight: 600; }
td a { color: var(--orange); text-decoration: none; font-weight: 600; }
.foot { color: var(--muted); font-size: 13px; margin: 0; }
a:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
</style>
</head>
<body>
<script>window.AOTW = [{"date": "2026-11-14", "artist": "Sugar", "album": "Copper Blue", "year": 1992, "genre": "Alternative rock", "id": 712, "blurb": "Bob Mould's first record with Sugar, his band after Hüsker Dü: loud, fuzzy guitars wrapped around huge pop hooks. NME made it their album of the year in 1992. Start with \"Helpless\" and \"If I Can't Change Your Mind\".", "url": "https://open.spotify.com/album/7ndxJRCMbUDbuUTEuiG23u", "art": "https://i.scdn.co/image/ab67616d0000b27392feb7c3b88219c8f576419e", "art_sm": "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e0292feb7c3b88219c8f576419e"}];</script>
<div class="wrap">
  <p style="margin:0"><a class="hl" href="./">← This week's guide</a></p>
  <section class="hero" aria-labelledby="t">
    <img class="cover" id="cover" alt="" width="280" height="280" hidden>
    <div class="info">
    <div class="eyebrow" id="when">Album of the week</div>
    <h1 id="t"><span id="album"></span></h1>
    <p class="artist" id="artist"></p>
    <div class="meta"><span><b id="year"></b></span><span id="genre"></span><span>From 1001 Albums You Must Hear Before You Die</span></div>
    <p class="blurb" id="blurb"></p>
    <a class="listen" id="listen" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Listen on Spotify</a>
    </div>
  </section>
  <section aria-labelledby="h">
    <h2 id="h">Every album of the week</h2>
    <div class="tablewrap"><table>
      <thead><tr><th><span style="position:absolute;left:-9999px">Cover</span></th><th>Date</th><th>Artist</th><th>Album</th><th>Year</th><th>Link</th></tr></thead>
      <tbody id="hist"></tbody>
    </table></div>
  </section>
  <p class="foot">Picked at random each Saturday from the 1,069 albums that have appeared in any edition of the book. No repeats.</p>
</div>
<script>
(function () {
  const list = window.AOTW || [];
  const fmt = (d) => new Date(d + 'T00:00:00Z').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
  const a = list[0];
  if (a) {
    document.getElementById('when').textContent = 'Album of the week · ' + fmt(a.date);
    document.getElementById('album').textContent = a.album;
    document.getElementById('artist').textContent = a.artist;
    document.getElementById('year').textContent = a.year;
    document.getElementById('genre').textContent = a.genre;
    document.getElementById('blurb').textContent = a.blurb;
    document.getElementById('listen').href = a.url;
    const cv = document.getElementById('cover');
    if (a.art || a.art_sm) { cv.alt = a.album + ' by ' + a.artist + ', album cover'; cv.onerror = () => { if (a.art_sm && cv.src !== a.art_sm) cv.src = a.art_sm; else { cv.hidden = true; cv.parentNode.classList.add('noart'); } }; cv.src = a.art || a.art_sm; cv.hidden = false; } else document.querySelector('.hero').classList.add('noart');
    document.title = a.album + ' · Album of the week';
  }
  const tb = document.getElementById('hist');
  list.forEach((r, i) => {
    const tr = document.createElement('tr'); if (i === 0) tr.className = 'now';
    const tdA = document.createElement('td'); tdA.className = 'art';
    if (r.art_sm || r.art) { const im = document.createElement('img'); im.src = r.art_sm || r.art; im.alt = ''; im.loading = 'lazy'; im.onerror = () => im.remove(); tdA.append(im); }
    tr.append(tdA);
    [fmt(r.date), r.artist, r.album, r.year].forEach((v, j) => { const td = document.createElement('td'); td.textContent = v; if (j === 3) td.className = 'num'; tr.append(td); });
    const td = document.createElement('td'); const l = document.createElement('a'); l.href = r.url; l.target = '_blank'; l.rel = 'noopener'; l.textContent = 'Spotify ↗'; td.append(l); tr.append(td);
    tb.append(tr);
  });
})();
</script>
</body>
</html>
